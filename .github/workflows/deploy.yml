name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays: refresh NASA data and redeploy
  workflow_dispatch:

permissions:
  contents: write # commit refreshed data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Refresh NASA data (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          npm run fetch-data
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/planets.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NASA exoplanet data"
            git push
          fi

      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
